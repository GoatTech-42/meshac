// Same mod, for Minecraft versions that still ship obfuscated (1.21.x). Picked by -Premap=1.
plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version, "mc": project.mc_range, "java": project.java_min }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

sourceSets.main.java.srcDir "src/${project.attack_src}/java"

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
